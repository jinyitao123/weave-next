schema: team-template/v1
name: correction-replay-heldout-20260910
display_name: 退款批次增量复核团队
purpose: 根据用户给出的退款批次数据完成计算、独立复核和可追溯报告，并允许对单一成员做有边界的增量纠偏
template: research_synthesis
template_parameters:
  lead_instruction: 只使用用户给出的三行数据组织计算和复核；不要搜索外部材料，不要补写不存在的事实。
  parallel_worker_refs: [calculator, reviewer]
  finalizer_ref: editor
  result_requirements:
    calculator: >-
      逐行计算退款率，保留两位小数，找出退款率最高和平均审核时长最长的批次。
      将完整计算写入 outputs/calculation.md，文件必须包含 source-version: initial，并在最终回复中引用该路径。
    reviewer: >-
      独立复算三行数据并检查排序。将复核依据写入 outputs/review.md，文件必须包含 review-baseline: accepted，
      并在最终回复中引用该路径。
    editor: >-
      根据原始任务和两份成员结果写入 outputs/refund-review.md，并在最终回复中明确引用该相对路径。
      文件必须逐字包含下面五行，不要给这些行添加序号、Markdown 表格边框或强调符号。
      case-a | 10.00% | 2
      case-b | 15.00% | 5
      case-c | 8.00% | 3
      priority: case-b
      duration-risk: case-b
members:
  - name: coordinator
    display_name: 复核负责人
    role: avatar
    responsibilities: [协调计算与复核, 汇总交付]
    capabilities: [task_delegation]
  - name: calculator
    display_name: 数据计算员
    role: worker
    responsibilities: [计算退款率, 保存计算依据]
    capabilities: [analysis]
  - name: reviewer
    display_name: 独立复核员
    role: worker
    responsibilities: [独立复算, 保存复核依据]
    capabilities: [verification]
  - name: editor
    display_name: 结果整理员
    role: worker
    responsibilities: [形成固定格式报告, 保存最终文件]
    capabilities: [report_writing]
lead: coordinator
delivery:
  success_criteria: [三项退款率正确, 优先级和审核时长风险判断正确, 报告文件可追溯]
  contract:
    version: 1
    coverage: explicit
    required_artifacts:
      - id: refund-review
        path: outputs/refund-review.md
        content_type: text/markdown
        contains:
          - "case-a | 10.00% | 2"
          - "case-b | 15.00% | 5"
          - "case-c | 8.00% | 3"
          - "priority: case-b"
          - "duration-risk: case-b"
    required_checks:
      - id: output-schema
        verifier_id: weave.output-schema
        verifier_version: v1
    external_effects: none
budget:
  max_cost_usd: 1.5
