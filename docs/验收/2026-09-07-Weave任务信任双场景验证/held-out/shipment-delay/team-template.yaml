schema: team-template/v1
name: shipment-delay-heldout-20260910
display_name: 运输线路复核团队
purpose: 根据用户给出的运输线路数据计算延误率并形成可核验的处置摘要
template: research_synthesis
template_parameters:
  lead_instruction: 只使用用户给出的三行数据，组织计算和复核；不要搜索外部材料，不要补写不存在的事实。
  parallel_worker_refs: [calculator, reviewer]
  finalizer_ref: editor
  result_requirements:
    calculator: 逐行计算延误率，保留两位小数，并找出延误率最高和平均运输时长最长的线路。
    reviewer: 独立复算三行数据，指出任何算术或排序错误；不要接受只给结论而没有计算依据的结果。
    editor: 根据原始任务和两份复核结果写入 outputs/shipment-delay-review.md，并在最终回复中明确引用该相对路径。文件必须逐字包含下面五行，不要给这些行添加序号、Markdown 表格边框或强调符号：route-n | 4.00% | 2；route-s | 7.50% | 6；route-w | 5.00% | 3；priority: route-s；duration-risk: route-w。
members:
  - name: coordinator
    display_name: 复核负责人
    role: avatar
    responsibilities: [协调计算与复核, 汇总交付]
    capabilities: [task_delegation]
  - name: calculator
    display_name: 数据计算员
    role: worker
    responsibilities: [计算延误率, 识别处置优先级]
    capabilities: [analysis]
  - name: reviewer
    display_name: 独立复核员
    role: worker
    responsibilities: [独立复算, 检查排序]
    capabilities: [verification]
  - name: editor
    display_name: 结果整理员
    role: worker
    responsibilities: [形成固定格式报告, 保存交付文件]
    capabilities: [report_writing]
lead: coordinator
delivery:
  success_criteria: [三项延误率正确, 优先级和运输时长风险判断正确, 报告文件可追溯]
  contract:
    version: 1
    coverage: explicit
    required_artifacts:
      - id: shipment-delay-review
        path: outputs/shipment-delay-review.md
        content_type: text/markdown
        contains:
          - "route-n | 4.00% | 2"
          - "route-s | 7.50% | 6"
          - "route-w | 5.00% | 3"
          - "priority: route-s"
          - "duration-risk: route-w"
    required_checks:
      - id: output-schema
        verifier_id: weave.output-schema
        verifier_version: v1
    external_effects: none
budget:
  max_cost_usd: 1.5
