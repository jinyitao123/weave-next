schema: team-template/v1
name: incident-review-heldout-20260910
display_name: 服务事件复核团队
purpose: 根据用户给出的服务事件数据计算失败率并形成可核验的处置摘要
template: research_synthesis
template_parameters:
  lead_instruction: 只使用用户给出的三行数据，组织计算和复核；不要搜索外部材料，不要补写不存在的事实。
  parallel_worker_refs: [calculator, reviewer]
  finalizer_ref: editor
  result_requirements:
    calculator: 逐行计算失败率，保留两位小数，并找出失败数最高和恢复时间最长的服务。
    reviewer: 独立复算三行数据，指出任何算术或排序错误；不要接受只给结论而没有计算依据的结果。
    editor: 根据原始任务和两份复核结果写入 outputs/incident-review.md，并在最终回复中明确引用该相对路径。文件必须逐字包含 contract 要求的五个结果标记。
members:
  - name: coordinator
    display_name: 复核负责人
    role: avatar
    responsibilities: [协调计算与复核, 汇总交付]
    capabilities: [task_delegation]
  - name: calculator
    display_name: 数据计算员
    role: worker
    responsibilities: [计算失败率, 识别处置优先级]
    capabilities: [analysis]
  - name: reviewer
    display_name: 独立复核员
    role: worker
    responsibilities: [独立复算, 检查排序]
    capabilities: [verification]
  - name: editor
    display_name: 结果整理员
    role: worker
    responsibilities: [形成固定格式报告, 保存交付文件]
    capabilities: [report_writing]
lead: coordinator
delivery:
  success_criteria: [三项失败率正确, 优先级和恢复风险判断正确, 报告文件可追溯]
  contract:
    version: 1
    coverage: explicit
    required_artifacts:
      - id: incident-review
        path: outputs/incident-review.md
        content_type: text/markdown
        contains:
          - "service-a | 5.00% | 6"
          - "service-b | 1.25% | 1"
          - "service-c | 5.00% | 10"
          - "priority: service-c"
          - "recovery-risk: service-b"
    required_checks:
      - id: output-schema
        verifier_id: weave.output-schema
        verifier_version: v1
    external_effects: none
budget:
  max_cost_usd: 1.5
