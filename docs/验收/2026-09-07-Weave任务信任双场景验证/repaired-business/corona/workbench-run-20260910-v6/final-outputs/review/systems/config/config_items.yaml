# 日冕计划 Pre-Phase A · v6 · 配置项注册（机器可读）
# 节点：systems-architect（corona-prephase-a-recovery-v6-systems-architect）
# 类型：register —— 引用冻结基线 corona-prephase-a-v1，并非新基线文件
# 注意：本文件不重定义任何参数；只做标识、受控属性与来源追溯。
schema_version: 1
register_type: configuration_baseline_register
baseline:
  baseline_id: corona-prephase-a-v1
  baseline_version: 1.0.0
  status: frozen_for_validation
  scope: Level-0 / Pre-Phase A conceptual study
  source_primary: ../日冕计划_任务背景与全程纪要_修订稿.md
  carrier_copy: v4-outputs/model/baseline.yaml   # v6 输入集内自包含副本（= complex-validation/baseline.yaml）
configuration_items:
  - ci: CI-01
    name: 速度轴（标准情景）
    controlled:
      cruise_speed_c: [0.01, 0.03, 0.05]
      default_scenario_c: 0.03
      scenario_ids: [S-0.01c, S-0.03c, S-0.05c]
    source: v4-outputs/model/baseline.yaml scenarios
  - ci: CI-02
    name: 物理常数
    controlled:
      speed_of_light_m_s: 299792458
      standard_gravity_m_s2: 9.80665
      proxima_distance_ly: 4.25
      ly_m: 9.4607304725808e15
      sec_per_year: 31557600
      tnt_equivalent_J_per_kg: 4184000
      au_m: 1.49597870700e11
      solar_lens_distance_au: 550.0
      precursor_distance_au: 1000.0
    source: v4-outputs/model/baseline.yaml + params.json constants
  - ci: CI-03
    name: 参考案例
    controlled:
      - {id: crewed_1mt, mass_kg: 1000000000, cruise_speed_c: 0.03}
      - {id: orbital_material_5mt, mass_kg: 5000000000, cruise_speed_c: 0.03}
      - {id: dust_1mg, mass_kg: 0.000001, relative_speed_c: 0.03}
      - {id: rotating_habitat, radius_m: 1000, rotation_rpm: 2}
    source: v4-outputs/model/baseline.yaml reference_cases
  - ci: CI-04
    name: 参考检查（0.03c 锚点）
    controlled:
      travel_years_at_0_03c: {expected: 141.6666667, relative_tolerance: 0.001}
      kinetic_energy_1mt_at_0_03c_j: {expected: 4.0443983e22, relative_tolerance: 0.01}
      kinetic_energy_5mt_at_0_03c_j: {expected: 2.0221991e23, relative_tolerance: 0.01}
      gravity_1km_2rpm_m_s2: {expected: 43.8649, relative_tolerance: 0.01}
      dust_1mg_0_03c_j: {expected: 40443983, relative_tolerance: 0.01}
    source: v4-outputs/model/baseline.yaml acceptance_reference_checks = acceptance.json reference_checks
  - ci: CI-05
    name: 路线
    controlled:
      - laser_sail_precursor # A
      - uncrewed_civilization_archive # B
      - crewed_interstellar_vehicle # C
    source: v4-outputs/model/baseline.yaml routes
  - ci: CI-06
    name: 真值标签
    controlled: [verified_fact, derived_result, assumption, unknown]
    source: v4-outputs/model/baseline.yaml truth_labels
  - ci: CI-07
    name: 禁止断言
    controlled: [construction_ready, manufacturing_ready, flight_certified, whole_program_cost_committed]
    source: v4-outputs/model/baseline.yaml forbidden_claims
  - ci: CI-08
    name: 参数模型机器/app 副本一致性
    controlled: {params_json_equals_baseline: true, params_js_equals_params_json: true}
    source: 数字工程 run_checks.py M3/M4 交叉核验
control:
  baseline_decision: 沿用 corona-prephase-a-v1，速度轴保持 0.01c/0.03c/0.05c，现有日冕材料不改写
  change_requests:
    - {cr: v6-DE-app, object: outputs/app/ (页面计算/情景切换/导出), executor: digital-engineering, scope: 仅修复可复现缺陷}
    - {cr: v6-VI-rerun, object: 十一项硬门槛独立复跑 + 唯一最终目录, executor: verification-integrator}
  rule: 任何参数/公式/单位/情景改动一律走变更控制，不得就地覆盖基线
