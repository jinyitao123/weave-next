<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-label="无人文明档案载荷概念图 (FB-01)">
  <title>FB-01 无人文明档案载荷（路线B）概念图 · 日冕计划 Pre-Phase A</title>
  <desc>概念级示意图：长航时档案载荷，含多层档案库、辐射/热屏蔽、RTG 电源、通信天线，沿 0.01c/0.03c/0.05c 巡航。仅概念示意，不可用于施工/制造/飞行认证。</desc>

  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>
  <rect x="14" y="14" width="892" height="592" fill="none" stroke="#1c2733" stroke-width="1.4"/>

  <text x="30" y="46" font-family="sans-serif" font-size="19" font-weight="700" fill="#1c2733">FB-01 · 无人文明档案载荷（路线 B）</text>
  <text x="30" y="68" font-family="sans-serif" font-size="12" fill="#4a5a6a">概念级 · Pre-Phase A · 基线 corona-prephase-a-v1 · v1.0.0</text>

  <!-- 载荷主体 -->
  <g transform="translate(230,150)">
    <!-- 辐射/热屏蔽 -->
    <rect x="0" y="0" width="340" height="260" rx="16" fill="#eef2f6" stroke="#4a5a6a" stroke-width="1.5"/>
    <rect x="30" y="30" width="280" height="200" rx="10" fill="none" stroke="#8a5a00" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="170" y="-6" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2733">辐射 / 热屏蔽壳</text>

    <!-- 多层档案库 -->
    <g transform="translate(70,60)">
      <rect x="0" y="0" width="200" height="34" rx="5" fill="#c8d6e5" stroke="#1c2733" stroke-width="1"/>
      <rect x="0" y="42" width="200" height="34" rx="5" fill="#b7c8db" stroke="#1c2733" stroke-width="1"/>
      <rect x="0" y="84" width="200" height="34" rx="5" fill="#c8d6e5" stroke="#1c2733" stroke-width="1"/>
      <rect x="0" y="126" width="200" height="34" rx="5" fill="#b7c8db" stroke="#1c2733" stroke-width="1"/>
      <text x="100" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2733">档案层 L1</text>
      <text x="100" y="64" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2733">档案层 L2</text>
      <text x="100" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2733">档案层 L3</text>
      <text x="100" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2733">档案层 L4</text>
    </g>
    <text x="170" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">多层档案库（多代信标/档案语义）</text>
  </g>

  <!-- 电源 RTG -->
  <g transform="translate(120,300)">
    <rect x="0" y="0" width="90" height="52" rx="8" fill="#f2f5f9" stroke="#4a5a6a" stroke-width="1.4"/>
    <text x="45" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">RTG 电源</text>
    <text x="45" y="40" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a5a6a">长期可靠性</text>
  </g>

  <!-- 通信天线 -->
  <g transform="translate(560,120)">
    <path d="M0 90 A90 90 0 0 1 180 90 Z" fill="#e8eef5" stroke="#1c2733" stroke-width="1.5"/>
    <line x1="90" y1="90" x2="90" y2="150" stroke="#1c2733" stroke-width="2"/>
    <rect x="70" y="150" width="40" height="22" rx="4" fill="#c8d6e5" stroke="#1c2733" stroke-width="1.2"/>
    <text x="90" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">高增益通信天线</text>
  </g>

  <!-- 轨道/巡航方向 -->
  <g transform="translate(230,470)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#0b5ea8" stroke-width="2" marker-end="url(#arrB)"/>
    <text x="260" y="-12" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0b5ea8">巡航方向（0.01c / 0.03c / 0.05c）</text>
  </g>
  <defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b5ea8"/></marker></defs>

  <!-- 情景航时注记 -->
  <g transform="translate(620,360)">
    <text x="0" y="0" font-family="sans-serif" font-size="12" fill="#1c2733">到比邻星 4.25 ly 航时（匀速）：</text>
    <text x="0" y="22" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.01c → 425.0 年</text>
    <text x="0" y="42" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.03c → 141.7 年</text>
    <text x="0" y="62" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.05c → 85.0 年</text>
    <text x="0" y="86" font-family="sans-serif" font-size="11" fill="#4a5a6a">均超出单次任务尺度</text>
    <text x="0" y="102" font-family="sans-serif" font-size="11" fill="#4a5a6a">→ 多代/档案/信标型目标</text>
  </g>

  <!-- 概念级标注 -->
  <g transform="translate(620,180)">
    <rect x="0" y="0" width="270" height="76" rx="8" fill="#fff8e6" stroke="#e6c979" stroke-width="1.3"/>
    <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#8a5a00">概念级 · 不可用于施工/制造/飞行认证</text>
    <text x="14" y="42" font-family="sans-serif" font-size="11" fill="#6a5200">示意非按比例；长期可靠性为</text>
    <text x="14" y="58" font-family="sans-serif" font-size="11" fill="#6a5200">unknown（缺直接证据），显式保留。</text>
  </g>

  <!-- 图签 -->
  <g transform="translate(30,540)">
    <rect x="0" y="0" width="280" height="52" fill="none" stroke="#1c2733" stroke-width="1"/>
    <text x="10" y="18" font-family="sans-serif" font-size="11" fill="#1c2733">图号 FB-01 · 版本 v1.0.0</text>
    <text x="10" y="34" font-family="sans-serif" font-size="10" fill="#4a5a6a">基线 corona-prephase-a-v1 · 速度轴 0.01/0.03/0.05c</text>
    <text x="10" y="46" font-family="sans-serif" font-size="10" fill="#4a5a6a">数字工程构建器 · 2026-09-09</text>
  </g>
</svg>
