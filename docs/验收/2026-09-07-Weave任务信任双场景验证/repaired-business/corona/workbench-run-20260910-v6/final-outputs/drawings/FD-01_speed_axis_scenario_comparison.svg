<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-label="三速度情景对比图 (FD-01)">
  <title>FD-01 三速度情景对比 · 日冕计划 Pre-Phase A</title>
  <desc>概念级数据图：对比 0.01c / 0.03c / 0.05c 三情景的到比邻星航时与 1mt 帆/载荷动能下限。仅概念示意，不可用于施工/制造/飞行认证。</desc>

  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>
  <rect x="14" y="14" width="892" height="592" fill="none" stroke="#1c2733" stroke-width="1.4"/>

  <text x="30" y="46" font-family="sans-serif" font-size="19" font-weight="700" fill="#1c2733">FD-01 · 三速度情景对比（0.01c / 0.03c / 0.05c）</text>
  <text x="30" y="68" font-family="sans-serif" font-size="12" fill="#4a5a6a">概念级 · Pre-Phase A · 基线 corona-prephase-a-v1 · v1.0.0 · 值来自 model/corona_model.py（derived_result）</text>

  <!-- ============ 面板 A：航时 ============ -->
  <g transform="translate(50,150)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1c2733">面板 A · 到比邻星 4.25 ly 航时 (yr)</text>
    <!-- axes -->
    <line x1="0" y1="20" x2="0" y2="310" stroke="#1c2733" stroke-width="1.4"/>
    <line x1="0" y1="310" x2="360" y2="310" stroke="#1c2733" stroke-width="1.4"/>
    <!-- gridlines -->
    <line x1="0" y1="100" x2="360" y2="100" stroke="#d5dde5" stroke-width="0.8"/>
    <text x="-6" y="104" text-anchor="end" font-family="sans-serif" font-size="10" fill="#4a5a6a">150</text>
    <line x1="0" y1="180" x2="360" y2="180" stroke="#d5dde5" stroke-width="0.8"/>
    <text x="-6" y="184" text-anchor="end" font-family="sans-serif" font-size="10" fill="#4a5a6a">300</text>
    <line x1="0" y1="260" x2="360" y2="260" stroke="#d5dde5" stroke-width="0.8"/>
    <text x="-6" y="264" text-anchor="end" font-family="sans-serif" font-size="10" fill="#4a5a6a">450</text>
    <text x="-26" y="165" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a5a6a" transform="rotate(-90,-26,165)">年 (yr)</text>

    <!-- bars: 425,141.667,85 -> height = val/450*290 from y=310 -->
    <rect x="50" y="310-244" width="70" height="244" fill="#0b5ea8" opacity="0.85"/>
    <rect x="160" y="310-91" width="70" height="91" fill="#2f8fb0" opacity="0.85"/>
    <rect x="270" y="310-55" width="70" height="55" fill="#7fc4d8" opacity="0.85"/>
    <text x="85" y="298-244" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1c2733" transform="translate(0,-8)">425</text>
    <text x="195" y="298-91" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1c2733" transform="translate(0,-8)">141.7</text>
    <text x="305" y="298-55" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1c2733" transform="translate(0,-8)">85</text>
    <text x="85" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">S-0.01c</text>
    <text x="195" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">S-0.03c</text>
    <text x="305" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">S-0.05c</text>
    <text x="180" y="352" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a5a6a">航时越短越好；三种速度均超出单次任务尺度</text>
  </g>

  <!-- ============ 面板 B：动能下限 ============ -->
  <g transform="translate(500,150)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1c2733">面板 B · 1mt 帆/载荷动能下限 (J, 对数轴)</text>
    <line x1="0" y1="20" x2="0" y2="310" stroke="#1c2733" stroke-width="1.4"/>
    <line x1="0" y1="310" x2="360" y2="310" stroke="#1c2733" stroke-width="1.4"/>
    <!-- log gridlines: 1e21 bottom, 1e24 top -->
    <line x1="0" y1="107" x2="360" y2="107" stroke="#d5dde5" stroke-width="0.8"/>
    <text x="-6" y="111" text-anchor="end" font-family="sans-serif" font-size="10" fill="#4a5a6a">1e22</text>
    <line x1="0" y1="193" x2="360" y2="193" stroke="#d5dde5" stroke-width="0.8"/>
    <text x="-6" y="197" text-anchor="end" font-family="sans-serif" font-size="10" fill="#4a5a6a">1e23</text>
    <text x="-26" y="165" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a5a6a" transform="rotate(-90,-26,165)">J（对数）</text>

    <!-- bars: log10(v). 21->310, 24->20, span 3, y = 310 - (log-21)/3*290 -->
    <!-- 4.4938e21 log=21.6526 -> h=63   ; 4.0444e22 log=22.6068 -> h=155 ; 1.1234e23 log=23.0505 -> h=198 -->
    <rect x="50" y="310-63" width="70" height="63" fill="#b04a3a" opacity="0.85"/>
    <rect x="160" y="310-155" width="70" height="155" fill="#b04a3a" opacity="0.85"/>
    <rect x="270" y="310-198" width="70" height="198" fill="#b04a3a" opacity="0.85"/>
    <text x="85" y="243" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2733">4.49e21 J</text>
    <text x="195" y="151" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2733">4.04e22 J</text>
    <text x="305" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2733">1.12e23 J</text>
    <text x="85" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">0.01c</text>
    <text x="195" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">0.03c</text>
    <text x="305" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">0.05c</text>
    <text x="180" y="352" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a5a6a">柱值为 1 mt（1e9 kg）质量基线 ½mv² 动能 → 4.49e21–1.12e23 J</text>
  </g>

  <!-- 束动力比注记 -->
  <g transform="translate(50,500)">
    <text x="0" y="0" font-family="sans-serif" font-size="12" fill="#1c2733">束动力比 P_REL（相对 0.2c 锚点）：</text>
    <text x="0" y="20" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.01c → ×400（≈0.25 GW） · 0.03c → ×44.4（≈2.25 GW） · 0.05c → ×16（≈6.25 GW）</text>
    <text x="0" y="42" font-family="sans-serif" font-size="11" fill="#4a5a6a">相较 0.2c / 100 GW 锚点，所需束动力下降 16–400 倍（缩放律为 assumption）。</text>
  </g>

  <!-- 概念级标注 -->
  <g transform="translate(520,500)">
    <rect x="0" y="0" width="250" height="72" rx="8" fill="#fff8e6" stroke="#e6c979" stroke-width="1.3"/>
    <text x="12" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#8a5a00">概念级 · 不可用于施工/制造/飞行认证</text>
    <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#6a5200">数据为模型推导（derived_result），</text>
    <text x="12" y="52" font-family="sans-serif" font-size="10" fill="#6a5200">非设计/制造/飞行依据；未含推进效率。</text>
    <text x="12" y="66" font-family="sans-serif" font-size="10" fill="#6a5200">航线均为匀速、未计加减速。</text>
  </g>

</svg>
