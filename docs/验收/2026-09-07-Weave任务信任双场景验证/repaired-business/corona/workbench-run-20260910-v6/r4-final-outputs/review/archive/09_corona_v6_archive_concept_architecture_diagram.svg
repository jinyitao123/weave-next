<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880"
     font-family="PingFang SC, Microsoft YaHei, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
  <!-- 概念级示意 · 不可用于施工/制造/飞行认证 · baseline: corona-prephase-a-v1 v1.0.0 -->
  <!-- v6 复用 v4：本图为 v6 节点复核并复用冻结 v4 概念架构示意，复用后 XML 解析通过、无外部脚本/资源，未作改动。 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1280" height="880" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="72" fill="#0f172a"/>

  <!-- 标题块 -->
  <text x="24" y="32" font-size="20" fill="#ffffff" font-weight="bold">日冕计划 · 文明档案载荷概念架构（概念级示意）</text>
  <text x="24" y="56" font-size="13" fill="#cbd5e1">
    figure_id: Fig B-01 · baseline_id: corona-prephase-a-v1 · v1.0.0 · scope: Level-0 / Pre-Phase A conceptual
  </text>
  <text x="24" y="68" font-size="11" fill="#94a3b8">免责：概念级 · 不可用于施工/制造/飞行认证 · 禁止 forbidden_claims 四类表述</text>

  <!-- ===================== 左侧：内容层 + 编码层 ===================== -->
  <g>
    <rect x="40" y="120" width="360" height="120" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="56" y="150" font-size="16" fill="#7f1d1d" font-weight="bold">L1 内容/策展层 [治理·伦理]</text>
    <text x="56" y="176" font-size="13" fill="black">文明核心（传世） vs 全部语料（完整）</text>
    <text x="56" y="196" font-size="12" fill="#4b5563">P_KEEP_CIV_CORE ≈ 1 MB 级 (assumption)</text>
    <text x="56" y="214" font-size="12" fill="#4b5563">P_FULL_CORPUS_BITS ≈ 1 PB (assumption)</text>
  </g>

  <g>
    <rect x="40" y="260" width="360" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="56" y="290" font-size="16" fill="#92400e" font-weight="bold">L2 编码/可读层 [TRL 低·需研发]</text>
    <text x="56" y="316" font-size="13" fill="black">通用罗塞塔 + 自描述元数据 + 纠错编码</text>
    <text x="56" y="336" font-size="12" fill="#4b5563">保证「无论谁拿到都能读」：物理/原子学共同语言</text>
    <text x="56" y="354" font-size="12" fill="#4b5563">EC/CRC 校验 + 版本清单（manifest）对账</text>
  </g>

  <!-- ===================== 中间：双介质存储层 ===================== -->
  <g>
    <rect x="440" y="120" width="400" height="260" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="458" y="150" font-size="16" fill="#1e3a8a" font-weight="bold">L3 物理存储层 · 双介质栈 [本节点核心]</text>

    <!-- 传世层 -->
    <rect x="458" y="168" width="364" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="472" y="192" font-size="14" fill="#14532d" font-weight="bold">传世层（端到端守护）· 主存活层</text>
    <text x="472" y="212" font-size="12" fill="#166534">介质：模拟蚀刻金属/类钻石（Voyager 类 + 微蚀刻）</text>
    <text x="472" y="230" font-size="12" fill="#166534">R_ENDUR ≈ 1e6 yr · 辐射近免疫 · 零耗电无刷新</text>
    <text x="472" y="246" font-size="12" fill="#166534">单副本 p(T)≈0.9995–0.9999 (85–425 yr)</text>

    <!-- 完整层 -->
    <rect x="458" y="266" width="364" height="86" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="472" y="290" font-size="14" fill="#312e81" font-weight="bold">完整层（高密度语料）· 纯增量层</text>
    <text x="472" y="310" font-size="12" fill="#3730a3">介质：光存/加固固态 + 纠错码 · R 30–300 yr</text>
    <text x="472" y="328" font-size="12" fill="#3730a3">K-of-N 冗余 + ECC → 单介质退化由冗余救回</text>

    <!-- 双介质箭头 -->
    <line x1="220" y1="310" x2="440" y2="310" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- ===================== 右侧：冗余/可靠性 ===================== -->
  <g>
    <rect x="880" y="120" width="360" height="260" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="898" y="150" font-size="16" fill="#581c87" font-weight="bold">可靠性 / 冗余路径（AR-01…AR-08）</text>

    <rect x="898" y="168" width="324" height="46" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
    <text x="910" y="188" font-size="12" fill="black">完整层：N-of-K 冗余 → P≥0.99 (5-of-3 即可)</text>
    <text x="910" y="204" font-size="11" fill="#4b5563">(假设副本独立；共模风险→需介质/舱/热控多样)</text>

    <rect x="898" y="224" width="324" height="46" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
    <text x="910" y="244" font-size="12" fill="black">传世层：零维护被动 → 不需维修即可跨越</text>
    <text x="910" y="260" font-size="11" fill="#4b5563">冗余维修退化=内建自愈，非在线修复</text>

    <rect x="898" y="280" width="324" height="46" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
    <text x="910" y="300" font-size="12" fill="black">主导未知：尘埃通量 = unknown</text>
    <text x="910" y="316" font-size="11" fill="#4b5563">不明知设计 · 建议先导载荷测量 · 不声称已证实可存活</text>
  </g>

  <!-- ===================== 标题区下方连接：L1/L2 -> L3 ===================== -->
  <line x1="220" y1="240" x2="220" y2="260" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="380" x2="640" y2="440" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== L4 总线层 ===================== -->
  <g>
    <rect x="300" y="440" width="680" height="150" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="318" y="470" font-size="16" fill="#1e293b" font-weight="bold">L4 载荷总线层</text>
    <g font-size="12" fill="#334155">
      <text x="318" y="496">供电：传世层零耗电（主存活）；完整层/信标需长寿命电源（RTG）</text>
      <text x="318" y="516">热控：介质温度稳定在存档标称窗口（超温折寿）</text>
      <text x="318" y="536">辐射屏蔽 &amp; Whipple 缓冲：铝当量 0–30 g/cm²，TID 预算 12–85 Gy 累计</text>
      <text x="318" y="556">指向/信标（仅独立构型）· 分离/生物密封（Planetary protection）</text>
    </g>
    <!-- 屏蔽图块 -->
    <rect x="760" y="474" width="200" height="98" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="776" y="498" font-size="12" fill="black">辐射/尘埃防护</text>
    <text x="776" y="518" font-size="11" fill="#475569">30 g/cm² Al 示意</text>
    <text x="776" y="536" font-size="11" fill="#475569">dose_T(425yr)≈61 Gy</text>
    <text x="776" y="554" font-size="11" fill="#475569">通量=unknown</text>
  </g>

  <!-- ===================== L5 集成接口层 ===================== -->
  <g>
    <rect x="300" y="620" width="680" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="318" y="650" font-size="16" fill="#1e293b" font-weight="bold">L5 集成接口层（两构型）</text>
    <text x="318" y="678" font-size="13" fill="black">构型 A · 搭载型 (hitchhiker)：作为路线 A 激光帆/母船子载荷</text>
    <text x="318" y="698" font-size="13" fill="black">构型 B · 独立型 (standalone)：自带电源/信标，就近端广播</text>
    <text x="318" y="718" font-size="12" fill="#475569">接口：质量/功耗/包络/分离/脱开 · 构型选择归 systems-architect + 治理/伦理裁决</text>
  </g>

  <line x1="640" y1="590" x2="640" y2="620" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== 参数/真值脚注 ===================== -->
  <g font-size="11" fill="#475569">
    <text x="40" y="802">参数（本节点新增，未入共享模型，跨专业引用须走 change/ 变更控制）：</text>
    <text x="40" y="820">P_KEEP_CIV_CORE / P_FULL_CORPUS_BITS / R_ENDUR_MEDIA(≈1e6yr·assumption) / N_REDUND,K_OF_N(derived) / DOSE_TID_BUDGET / P_ARCHIVE_SURVIVE(0.99) / VERIFY_REQ</text>
    <text x="40" y="838">真值标签：TIME_ALPHA(S-0.05c)=85yr / (S-0.03c)=141.667yr / (S-0.01c)=425yr (derived·frozen) · 1mg 尘埃撞击能 4.49e6/4.04e7/1.12e8 J · 尘埃通量=unknown(无直接证据)</text>
    <text x="40" y="856">日期 2026-09-09 · who: archive-reliability-designer(需求方) / digital-engineering-builder(drawing 方) · 本图为概念示意，非最终交付图 (drawings/ 由 digital-engineering-builder 按 08 绘制)</text>
    <text x="40" y="874">三情景贯穿 S-0.01c / S-0.03c / S-0.05c · 无单 0.03c 残留 · 禁止 forbidden_claims 四类表述</text>
  </g>
</svg>
