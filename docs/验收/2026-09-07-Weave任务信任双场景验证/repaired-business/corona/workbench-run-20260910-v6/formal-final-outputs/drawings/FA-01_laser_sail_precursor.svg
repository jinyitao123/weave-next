<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-label="激光光帆先锋探测器概念图 (FA-01)">
  <title>FA-01 激光光帆（路线A）概念图 · 日冕计划 Pre-Phase A</title>
  <desc>概念级示意图：地面/轨道激光阵列向光帆探针发射光束，探针沿 0.01c/0.03c/0.05c 巡航；标注太阳引力透镜区与 1000 AU 前驱。仅概念示意，不可用于施工/制造/飞行认证。</desc>

  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b5ea8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0b5ea8" stop-opacity="0.75"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b5ea8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>

  <!-- 图框 -->
  <rect x="14" y="14" width="892" height="592" fill="none" stroke="#1c2733" stroke-width="1.4"/>

  <!-- 标题 -->
  <text x="30" y="46" font-family="sans-serif" font-size="19" font-weight="700" fill="#1c2733">FA-01 · 激光光帆先锋探测器（路线 A）</text>
  <text x="30" y="68" font-family="sans-serif" font-size="12" fill="#4a5a6a">概念级 · Pre-Phase A · 基线 corona-prephase-a-v1 · v1.0.0</text>

  <!-- 激光阵列 -->
  <g transform="translate(70,220)">
    <rect x="0" y="0" width="150" height="140" rx="10" fill="#eef2f6" stroke="#4a5a6a" stroke-width="1.4"/>
    <text x="75" y="-10" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2733">激光阵列（束动力）</text>
    <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.01c → 0.25 GW</text>
    <text x="75" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.03c → 2.25 GW</text>
    <text x="75" y="64" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.05c → 6.25 GW</text>
    <text x="75" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a5a6a">(相对 0.2c / 100 GW 锚点)</text>
    <text x="75" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a5a00">束动力比 P_REL = (0.2/c)²</text>
  </g>

  <!-- 光束 -->
  <rect x="220" y="282" width="430" height="16" fill="url(#beam)"/>
  <line x1="220" y1="290" x2="650" y2="290" stroke="#0b5ea8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0b5ea8">受控激光束（示意）</text>

  <!-- 帆与探针 -->
  <g transform="translate(650,235)">
    <path d="M0 60 L-70 -35 L-30 -35 L0 0 L30 -35 L70 -35 Z" fill="#c8d6e5" stroke="#1c2733" stroke-width="1.5"/>
    <rect x="-30" y="12" width="60" height="40" rx="6" fill="#f2f5f9" stroke="#4a5a6a" stroke-width="1.4"/>
    <circle cx="0" cy="32" r="7" fill="#0b5ea8"/>
    <text x="80" y="-40" font-family="sans-serif" font-size="12" fill="#1c2733">光帆探针（克级载荷）</text>
    <text x="80" y="-20" font-family="sans-serif" font-size="11" fill="#4a5a6a">a = 0.2c 锚点 → 光帆</text>
  </g>

  <!-- 距离轴 -->
  <g transform="translate(70,480)">
    <line x1="0" y1="0" x2="720" y2="0" stroke="#1c2733" stroke-width="1.6"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#1c2733" stroke-width="1.6"/>
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2733">地球/轨道</text>
    <line x1="480" y1="-6" x2="480" y2="6" stroke="#4a5a6a" stroke-width="1.6"/>
    <text x="480" y="-14" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a5a6a">太阳引力透镜区 550 AU</text>
    <line x1="700" y1="-6" x2="700" y2="6" stroke="#4a5a6a" stroke-width="1.6"/>
    <text x="700" y="-14" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a5a6a">1000 AU 前驱</text>
  </g>

  <!-- 情景航时注记 -->
  <g transform="translate(70,530)">
    <text x="0" y="0" font-family="sans-serif" font-size="12" fill="#1c2733">到 550 AU 透镜区航时（匀速）：</text>
    <text x="0" y="20" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.01c ≈ 318 天 · 0.03c ≈ 106 天 · 0.05c ≈ 64 天</text>
    <text x="0" y="44" font-family="sans-serif" font-size="12" fill="#1c2733">到 1000 AU 前驱航时：</text>
    <text x="0" y="64" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.01c ≈ 19.0 月 · 0.03c ≈ 6.3 月 · 0.05c ≈ 3.8 月</text>
  </g>

  <!-- 概念级标注 -->
  <g transform="translate(30,340)">
    <rect x="0" y="0" width="270" height="86" rx="8" fill="#fff8e6" stroke="#e6c979" stroke-width="1.3"/>
    <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#8a5a00">概念级 · 不可用于施工/制造/飞行认证</text>
    <text x="14" y="42" font-family="sans-serif" font-size="11" fill="#6a5200">示意非按比例；束动力为概念量级，未含</text>
    <text x="14" y="58" font-family="sans-serif" font-size="11" fill="#6a5200">推进效率/光束传播损耗。派生量标记</text>
    <text x="14" y="74" font-family="sans-serif" font-size="11" fill="#6a5200">derived_result；0.2c/100GW 为 B 级锚点。</text>
  </g>

  <!-- 图签 -->
  <g transform="translate(620,540)">
    <rect x="0" y="0" width="270" height="52" fill="none" stroke="#1c2733" stroke-width="1"/>
    <text x="10" y="18" font-family="sans-serif" font-size="11" fill="#1c2733">图号 FA-01 · 版本 v1.0.0</text>
    <text x="10" y="34" font-family="sans-serif" font-size="10" fill="#4a5a6a">基线 corona-prephase-a-v1 · 速度轴 0.01/0.03/0.05c</text>
    <text x="10" y="46" font-family="sans-serif" font-size="10" fill="#4a5a6a">数字工程构建器 · 2026-09-09</text>
  </g>
</svg>
