<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-label="载人星际飞行器概念图 (FC-01)">
  <title>FC-01 载人星际飞行器（路线C）概念图 · 日冕计划 Pre-Phase A</title>
  <desc>概念级示意图：长任务载人星际飞行器，含旋转居住环（半径 1000 m、2 rpm，产生 4.473 g0 人工重力）、辐射/尘埃屏蔽、推进与生活舱。仅概念示意，不可用于施工/制造/飞行认证。</desc>

  <defs>
    <radialGradient id="ringGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="0.9" stop-color="#b7c8db"/>
    </radialGradient>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b5ea8"/></marker>
  </defs>

  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>
  <rect x="14" y="14" width="892" height="592" fill="none" stroke="#1c2733" stroke-width="1.4"/>

  <text x="30" y="46" font-family="sans-serif" font-size="19" font-weight="700" fill="#1c2733">FC-01 · 载人星际飞行器（路线 C）</text>
  <text x="30" y="68" font-family="sans-serif" font-size="12" fill="#4a5a6a">概念级 · Pre-Phase A · 基线 corona-prephase-a-v1 · v1.0.0</text>

  <!-- 旋转居住环 -->
  <g transform="translate(340,230)">
    <circle cx="0" cy="0" r="150" fill="url(#ringGrad)" stroke="#1c2733" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="#f2f5f9" stroke="#4a5a6a" stroke-width="1.5"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#0b5ea8" stroke-width="2"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#0b5ea8" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#0b5ea8"/>
    <text x="0" y="-160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2733">旋转居住环（r = 1000 m 概念）</text>
    <text x="0" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0b5ea8">2 rpm → 43.865 m/s² = 4.473 g₀</text>
    <text x="0" y="203" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a5a6a">1 g₀ 所需转速 → 0.946 rpm</text>
  </g>

  <!-- 推进段 -->
  <g transform="translate(60,270)">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#eef2f6" stroke="#4a5a6a" stroke-width="1.4"/>
    <polygon points="120,10 150,35 120,60" fill="#c8d6e5" stroke="#1c2733" stroke-width="1.3"/>
    <text x="60" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c2733">推进/能源</text>
    <text x="60" y="44" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a5a6a">效率 unknown</text>
  </g>

  <!-- 生活舱 -->
  <g transform="translate(640,250)">
    <rect x="0" y="0" width="140" height="90" rx="10" fill="#f2f5f9" stroke="#4a5a6a" stroke-width="1.4"/>
    <rect x="12" y="12" width="116" height="30" rx="5" fill="#c8d6e5" stroke="#1c2733" stroke-width="1"/>
    <rect x="12" y="50" width="54" height="28" rx="5" fill="#c8d6e5" stroke="#1c2733" stroke-width="1"/>
    <rect x="74" y="50" width="54" height="28" rx="5" fill="#c8d6e5" stroke="#1c2733" stroke-width="1"/>
    <text x="70" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2733">生活 / 科研舱</text>
  </g>

  <!-- 尘埃/辐射屏蔽 -->
  <g transform="translate(210,220)">
    <rect x="0" y="0" width="400" height="180" rx="20" fill="none" stroke="#8a5a00" stroke-width="1.4" stroke-dasharray="8 5"/>
    <text x="200" y="-8" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a5a00">尘埃 / 辐射屏蔽壳（概念）</text>
  </g>

  <!-- 巡航方向 -->
  <g transform="translate(80,470)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#0b5ea8" stroke-width="2" marker-end="url(#arrC)"/>
    <text x="260" y="-12" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0b5ea8">巡航方向（0.01c / 0.03c / 0.05c）</text>
  </g>

  <!-- 情景航时注记 -->
  <g transform="translate(620,440)">
    <text x="0" y="0" font-family="sans-serif" font-size="12" fill="#1c2733">到比邻星 4.25 ly 航时（匀速）：</text>
    <text x="0" y="22" font-family="sans-serif" font-size="12" fill="#0b5ea8">0.05c → 85.0 年（下限）</text>
    <text x="0" y="42" font-family="sans-serif" font-size="11" fill="#4a5a6a">任何载人星际在这些速度下</text>
    <text x="0" y="58" font-family="sans-serif" font-size="11" fill="#4a5a6a">均为百年尺度 → 不可承诺时间表</text>
  </g>

  <!-- 概念级标注 -->
  <g transform="translate(620,180)">
    <rect x="0" y="0" width="270" height="76" rx="8" fill="#fff8e6" stroke="#e6c979" stroke-width="1.3"/>
    <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#8a5a00">概念级 · 不可用于施工/制造/飞行认证</text>
    <text x="14" y="42" font-family="sans-serif" font-size="11" fill="#6a5200">示意非按比例；推进效率、尘埃通量</text>
    <text x="14" y="58" font-family="sans-serif" font-size="11" fill="#6a5200">为 unknown（缺直接证据），显式保留。</text>
  </g>

  <!-- 图签 -->
  <g transform="translate(30,540)">
    <rect x="0" y="0" width="280" height="52" fill="none" stroke="#1c2733" stroke-width="1"/>
    <text x="10" y="18" font-family="sans-serif" font-size="11" fill="#1c2733">图号 FC-01 · 版本 v1.0.0</text>
    <text x="10" y="34" font-family="sans-serif" font-size="10" fill="#4a5a6a">基线 corona-prephase-a-v1 · 速度轴 0.01/0.03/0.05c</text>
    <text x="10" y="46" font-family="sans-serif" font-size="10" fill="#4a5a6a">数字工程构建器 · 2026-09-09</text>
  </g>
</svg>
