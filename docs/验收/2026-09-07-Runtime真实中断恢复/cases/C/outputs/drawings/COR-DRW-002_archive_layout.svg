<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Helvetica, 'PingFang SC', sans-serif">
  <title>COR-DRW-002 无人文明档案载荷功能分区图 (概念级)</title>
  <desc>路线 2 载荷功能分区, 概念级, 单一 0.03c 巡航情景</desc>

  <rect x="0" y="0" width="1240" height="900" fill="#f7f8fa"/>
  <rect x="20" y="20" width="1200" height="860" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="20" y="20" width="1200" height="60" fill="#0b572a"/>
  <text x="40" y="57" fill="#fff" font-size="24" font-weight="bold">COR-DRW-002 · 无人文明档案载荷功能分区图 · 概念级 · v1.0.0</text>

  <text x="40" y="106" font-size="13" fill="#b00" font-weight="bold">边界: 概念级功能分区示意; 质量/尺寸未定 [unknown]; 任何单一存储介质不等同完整文明备份 [verified_fact 来源: 纪要 §三.5]</text>

  <!-- 载荷外轮廓: 鞭普尔盾 + 主体舱段 -->
  <g>
    <line x1="120" y1="180" x2="120" y2="640" stroke="#5f6368" stroke-width="4" stroke-dasharray="10,6"/>
    <line x1="180" y1="200" x2="180" y2="620" stroke="#5f6368" stroke-width="3" stroke-dasharray="6,6"/>
    <text x="60" y="170" font-size="12" fill="#333">鞭普尔盾列 (十千米级间距仅为待评估概念) [unknown/assumption]</text>
    <text x="46" y="415" font-size="11" fill="#555" transform="rotate(-90 46 415)">来流方向 0.03c 相对尘埃 →</text>

    <rect x="240" y="160" width="760" height="500" fill="#fff" stroke="#0b572a" stroke-width="2.5"/>
    <text x="260" y="188" font-size="15" font-weight="bold" fill="#0b572a">档案载荷主体 (功能分区, 非结构图)</text>

    <!-- 分区块 -->
    <rect x="260" y="205" width="350" height="130" fill="#e6f4ea" stroke="#188038"/>
    <text x="275" y="232" font-size="13" font-weight="bold">A · 长期存储区</text>
    <text x="275" y="254" font-size="11">石英存储 / DNA 样本 / 种子 / 微生物群落</text>
    <text x="275" y="272" font-size="11">分别研究, 冗余布局 [verified_fact 来源: 纪要 §三.5]</text>
    <text x="275" y="290" font-size="11" fill="#b00">样本复苏与保存寿命 [unknown]</text>
    <text x="275" y="315" font-size="10" fill="#555">温度/辐射环境指标未定 [unknown]</text>

    <rect x="630" y="205" width="350" height="130" fill="#e8f0fe" stroke="#3367d6"/>
    <text x="645" y="232" font-size="13" font-weight="bold">B · 校验与解码说明区</text>
    <text x="645" y="254" font-size="11">完整性校验、自描述解码说明、版本迁移</text>
    <text x="645" y="272" font-size="11">[verified_fact 来源: 纪要 §三.5 研究清单]</text>
    <text x="645" y="290" font-size="11" fill="#b00">跨世纪编码可读性方案 [unknown]</text>

    <rect x="260" y="355" width="350" height="130" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="275" y="382" font-size="13" font-weight="bold">C · 读取设备与再制造区</text>
    <text x="275" y="404" font-size="11">读取设备备件与再制造能力</text>
    <text x="275" y="422" font-size="11">失效后降级运行方案 [verified_fact 来源: 纪要 §三.4]</text>
    <text x="275" y="440" font-size="11" fill="#b00">百年级器件老化数据 [unknown]</text>

    <rect x="630" y="355" width="350" height="130" fill="#fce8e6" stroke="#d93025"/>
    <text x="645" y="382" font-size="13" font-weight="bold">D · 行星保护与隔离区</text>
    <text x="645" y="404" font-size="11">生物样本隔离、行星保护规程</text>
    <text x="645" y="422" font-size="11">[verified_fact 来源: 纪要 §三.5 研究清单]</text>
    <text x="645" y="440" font-size="11" fill="#b00">目标系统就位后的处置规则未定 [unknown]</text>

    <rect x="260" y="505" width="720" height="130" fill="#f3e8fd" stroke="#9334e6"/>
    <text x="275" y="532" font-size="13" font-weight="bold">E · 服务系统区 (电源 / 热控 / 通信 / 姿控)</text>
    <text x="275" y="554" font-size="11">接口定义见 COR-DRW-003 与 interface_control.md; 百年级电源方案 [unknown]</text>
    <text x="275" y="572" font-size="11">尘埃环境: 1mg@0.03c ≈ 4.0444×10⁷ J ≈ 9.67 kg TNT [derived_result]; 通量与粒径分布 [unknown]</text>
    <text x="275" y="590" font-size="11">防护设计须给出: 通量、粒径分布、盾体面密度、间距、消耗率、补充方式、总质量 [verified_fact 来源: 纪要 §二.4]</text>
    <text x="275" y="615" font-size="10" fill="#555">TNT 换算约定 1 kg = 4.184e6 J [assumption]</text>
  </g>

  <!-- 航线注记 -->
  <g>
    <line x1="1030" y1="410" x2="1180" y2="410" stroke="#0b572a" stroke-width="3" marker-end="url(#arr)"/>
    <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#0b572a"/></marker></defs>
    <text x="1040" y="392" font-size="11">运输方案另行论证 [unknown]</text>
    <text x="1040" y="435" font-size="11">0.03c 情景下量级 141.67 yr [derived_result]</text>
  </g>

  <!-- 假设与参数追踪表 -->
  <g>
    <rect x="60" y="690" width="1120" height="90" fill="#fff" stroke="#888" stroke-dasharray="4,3"/>
    <text x="80" y="714" font-size="13" font-weight="bold">假设 [assumption]: 分区仅表达功能关系, 不含质量/体积分配; 盾列间距与面密度为待评估概念。</text>
    <text x="80" y="738" font-size="13">显式未知项 [unknown]: 载荷质量规模、运输方案、尘埃通量与粒径分布、材料性能、百年级器件寿命、解码可读性。</text>
    <text x="80" y="762" font-size="13">纪律: 不以克级光帆可行性外推本载荷; 不承诺建造/制造/飞行认证就绪。</text>
  </g>

  <g>
    <rect x="60" y="796" width="1120" height="68" fill="#eee" stroke="#333"/>
    <text x="70" y="818" font-size="11" font-weight="bold">参数追踪表 (唯一参数源: outputs/model/baseline_frozen.yaml):</text>
    <text x="70" y="837" font-size="10">cruise_speed_c=0.03 (锁定) · dust_1mg=1e-6 kg → 4.0444e7 J · c=299792458 m/s · proxima_distance_ly=4.25 → 141.6667 yr</text>
    <text x="70" y="854" font-size="10">追溯键: corona-baseline-1.0.0 / 1.0.0 / cfb12b78…8b10c2 | 图号 COR-DRW-002 · v1.0.0 · 概念级</text>
  </g>
</svg>
