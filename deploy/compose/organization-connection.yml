# Optional: lets administrators download the organization connection file from
# the console ("部署连接"). Add it after the base file:
#
#   docker compose -f docker-compose.platform.yml \
#     -f deploy/compose/organization-connection.yml up -d
#
# WEAVE_ORGANIZATION_CONNECTION_HOST_FILE is the file on the deployment host,
# created by the deployment administrator before starting (see
# organization-connection.example.json and docs/部署/自托管部署配置.md). It is
# mounted read-only, and a missing host file stops the start instead of being
# created as an empty directory.
services:
  weave:
    environment:
      WEAVE_ORGANIZATION_CONNECTION_FILE: /run/weave/organization-connection.json
    volumes:
      - type: bind
        source: ${WEAVE_ORGANIZATION_CONNECTION_HOST_FILE:?set WEAVE_ORGANIZATION_CONNECTION_HOST_FILE to the organization connection file on this host}
        target: /run/weave/organization-connection.json
        read_only: true
        bind:
          create_host_path: false
