# Optional: reads the credential encryption key from a file on the host instead
# of the WEAVE_SECRET_KEY variable. Add it after the base file:
#
#   docker compose -f docker-compose.platform.yml \
#     -f deploy/compose/secret-key-file.yml up -d
#
# WEAVE_SECRET_KEY_HOST_FILE is the key file on the deployment host, holding
# 64 hex characters or base64 of 32 bytes (openssl rand -hex 32). The key is
# read from the file only: WEAVE_SECRET_KEY is cleared here, because the server
# refuses to start when both are set. The file is mounted read-only, and a
# missing host file stops the start instead of being created as a directory.
services:
  weave:
    environment:
      WEAVE_SECRET_KEY: ""
      WEAVE_SECRET_KEY_FILE: /run/weave/secret-key
    volumes:
      - type: bind
        source: ${WEAVE_SECRET_KEY_HOST_FILE:?set WEAVE_SECRET_KEY_HOST_FILE to the credential encryption key file on this host}
        target: /run/weave/secret-key
        read_only: true
        bind:
          create_host_path: false
