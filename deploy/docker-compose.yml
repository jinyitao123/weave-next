services:
  weave:
    build:
      context: .
      dockerfile: Dockerfile.weave-prebuilt
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://weave:weave@db:5432/weave?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      WEAVE_SECRET_KEY: ${WEAVE_SECRET_KEY:?set WEAVE_SECRET_KEY (openssl rand -hex 32)}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-deepseek-v4-flash}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ontology-mcp:
    build:
      context: ../../ontology
      dockerfile: server/Dockerfile
    ports:
      - "9091:9091"
    environment:
      PG_URL: postgres://weave:weave@db:5432/weave?sslmode=disable
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: spareparts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ontology-ui:
    build:
      context: ../../ontology/app
      dockerfile: Dockerfile
    ports:
      - "8089:80"
    volumes:
      - ../../ontology/app/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - weave
      - ontology-mcp
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: weave
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave"]
      interval: 2s
      timeout: 5s
      retries: 5
    # Uncomment to expose PostgreSQL for local debugging (`psql -h localhost`).
    # ports:
    #   - "127.0.0.1:5432:5432"
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/spareparts
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
