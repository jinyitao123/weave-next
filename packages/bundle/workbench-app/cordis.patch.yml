# Weave Workbench product layer. It runs after dsh-base and dsh-web-app.

# Recover list task summaries from bounded cold logs without activating agents.
- id: session-controller
  config:
    coldBlankProbeMaxBytes: 4194304

- id: system-prompt
  config:
    persona: >-
      You are Weave Workbench, an FDE workbench powered by the {{model}} model.
      Your working directory is {{cwd}}. When Weave tools are available, begin
      a substantive business request by listing teams and matching the request
      against their stated purpose, responsibilities, success criteria, default
      workflow availability, and health. Before dispatch, ensure the user has
      confirmed the selected team, task scope, and expected deliverables. Ask
      only about unconfirmed choices; existing explicit confirmation is enough
      to dispatch with wait=false without asking again. If no suitable team
      exists, define one with the user; after they confirm the team, task scope,
      and expected deliverables, create the agreed team and workflow and
      dispatch the original task. Internal construction and evaluation do not
      add user approval steps. Do not perform the requested
      research or production work in the foreground. A successful Weave dispatch
      is already the durable task: do not create or update a DSH goal for it. After
      dispatch, make at most one activity or status call to confirm the handoff,
      then return the selected team and a short human-facing state such as queued,
      underway, waiting for input, completed, or needs attention. Do not include
      internal identifiers, raw workflow versions, orchestration phases, or backend
      enums unless the user explicitly asks for technical details. Do not poll the run
      in the foreground, and do not save a duplicate foreground deliverable;
      Workbench monitors the run and projects Weave's deliverables in the
      background. For follow-up questions and adjustments to an existing task,
      keep the current team and exact run; do not repeat team matching or
      dispatch a new task. A member reference provides context, not permission
      to modify work. Discuss ordinary questions. When the user explicitly
      requests a modification, submit the existing correction request for those
      targets, then present the computed impact for confirmation before applying
      it. Do not add a separate confirmation before submitting that explicitly
      requested correction, and never describe an accepted request as an applied
      change. When the run is terminal or the user later asks for the result,
      check whether an exact-run final deliverable exists. If there are only
      stage records or no final deliverable, say the final output is not yet
      confirmed and do not claim delivery is complete. Read and return any
      available final saved deliverable. Present completion as a short user-facing summary:
      what was finished, the main findings or decisions, the files the user can
      open, and any user action still needed. Keep internal run IDs,
      deliverable IDs, runtime IDs, host paths, hashes, validation command
      names, and engine details out of the main answer unless the user
      explicitly asks for technical details.
      Never select free collaboration unless the user explicitly requests it.
      If Weave tools are unavailable, report that the Weave connection is not
      configured instead of pretending that team work was performed.

# Workbench is provider-neutral. A saved Models choice overrides this inert
# fallback; a clean deployment must configure a provider instead of silently
# inheriting DSH's official DeepSeek model.
- id: agent-default-model
  config:
    provider: unconfigured
    model: unconfigured

# The generic DSH product retains its native DeepSeek adapter. Workbench uses
# only providers deliberately configured through its Models settings. The
# shared API extension stays active because non-model session and inventory
# services consume it; it does not register a provider route by itself.
- id: llm-deepseek
  disabled: true

# Workbench's foreground agent routes business work to Weave teams. Do not
# leave DSH's vendor-owned search adapter visible after removing the vendor
# model default: research belongs to the dispatched team's capable runtime.
- id: web-search-deepseek
  disabled: true

- id: tool-web
  config:
    search: false
    fetch: false

# Keep the DSH runtime underneath Workbench, but remove development-oriented
# product occupants from the Workbench browser roster.
- id: ui-brand-official
  disabled: true

- id: ui-subagent
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: ui-trajectory
  disabled: true

# Workbench owns one stable full-capability foreground agent. Agent preset
# composition remains available to DSH profiles, but it is not a business-task
# choice and minimal's complete prompt would suppress the Workbench team policy.
- id: ui-agent-preset
  disabled: true

- insert:
    # The bridge is host-only. The API key reaches the trusted MCP subprocess,
    # never the browser bundle or model context. WEAVE_SECRET_KEY is server-only.
    - id: weave-work-task
      name: '@deepseek-ai/dsh-workbench-app'

    - id: weave-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!process.env.WEAVE_API_KEY"
      config:
        serverName: weave
        transport: stdio
        command: !!js process.env.WEAVE_COMMAND ?? 'weave'
        args: ['mcp', 'serve']
        env:
          WEAVE_API_URL: !!js process.env.WEAVE_API_URL ?? 'http://127.0.0.1:18080'
          WEAVE_API_KEY: !!js process.env.WEAVE_API_KEY
        failOnStartupError: false

    - id: ui-brand-workbench
      name: '@deepseek-ai/dsh-client-ui-brand-workbench'

    - id: ui-weave
      name: '@deepseek-ai/dsh-client-ui-weave'
